  <line x1="410" y1="90" x2="900" y2="90" stroke="#2e3037"/>
  <!-- table -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">
    <rect x="410" y="90" width="490" height="20" fill="#1e2027"/>
    <text x="420" y="104" fill="#8b949e">LANGUAGE</text>
    <text x="640" y="104" fill="#8b949e" text-anchor="end">FILES</text>
    <text x="730" y="104" fill="#8b949e" text-anchor="end">CODE</text>
    <text x="880" y="104" fill="#8b949e" text-anchor="end">CX</text>
    <g fill="#cfd3d8">
      <text x="420" y="126">JavaScript</text><text x="640" y="126" text-anchor="end">208</text><text x="730" y="126" text-anchor="end" font-weight="600">45,571</text><text x="880" y="126" text-anchor="end">18,756</text>
      <text x="420" y="146">CSS</text><text x="640" y="146" text-anchor="end">8</text><text x="730" y="146" text-anchor="end" font-weight="600">1,983</text><text x="880" y="146" text-anchor="end">5</text>
      <text x="420" y="166">Python</text><text x="640" y="166" text-anchor="end">2</text><text x="730" y="166" text-anchor="end" font-weight="600">368</text><text x="880" y="166" text-anchor="end">94</text>
      <text x="420" y="186" fill="#8b949e">JSON <tspan font-size="9">data</tspan></text><text x="640" y="186" text-anchor="end" fill="#8b949e">6</text><text x="730" y="186" text-anchor="end" fill="#8b949e" font-weight="600">299</text><text x="880" y="186" text-anchor="end" fill="#8b949e">0</text>
    </g>
    <line x1="410" y1="198" x2="900" y2="198" stroke="#cfd3d8"/>
    <text x="420" y="216" fill="#cfd3d8" font-weight="600">Total</text><text x="640" y="216" text-anchor="end" fill="#cfd3d8" font-weight="600">290</text><text x="730" y="216" text-anchor="end" fill="#cfd3d8" font-weight="600">55,470</text><text x="880" y="216" text-anchor="end" fill="#cfd3d8" font-weight="600">18,870</text>
  </g>
  <!-- analyses legend -->
  <text x="420" y="250" fill="#8b949e" font-size="11">Also: Complexity · Hotspots (churn × cx) · Coverage · TODO ·</text>
  <text x="420" y="268" fill="#8b949e" font-size="11">Secrets · Dependencies · Duplication · Function complexity</text>
  <text x="420" y="300" fill="#7ee787" font-size="11">Report → a multi-page PDF, generated server-side with plain Python.</text>
  <text x="420" y="318" fill="#7ee787" font-size="11">⏱ → optional background auto-refresh (systemd user timer).</text>

  <text x="12" y="430" fill="#5c5f6b" font-size="11">Terminal · repo tree (complexity badges) · scc code-census with sortable analyses, one-click tool installs and a PDF report</text>
</svg>
