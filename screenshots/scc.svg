  <rect x="230" y="56" width="180" height="384" fill="#1b1d21"/>
  <line x1="230" y1="56" x2="230" y2="440" stroke="#2e3037"/>
  <text x="242" y="75" fill="#8b949e" font-size="11" letter-spacing="0.6">REPO</text>
  <line x1="230" y1="84" x2="410" y2="84" stroke="#2e3037"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">
    <text x="240" y="104" fill="#8b949e">▾</text><text x="256" y="104" fill="#cfd3d8">project</text>
    <text x="254" y="124" fill="#58a6ff">parser.js</text><text x="392" y="124" fill="#8b949e" font-size="10" text-anchor="end">112</text>
    <text x="254" y="144" fill="#cfd3d8">lexer.js</text><text x="392" y="144" fill="#8b949e" font-size="10" text-anchor="end">44</text>
    <text x="254" y="164" fill="#56d364">newfile.js</text><text x="392" y="164" fill="#8b949e" font-size="10" text-anchor="end">8</text>
    <text x="254" y="184" fill="#cfd3d8">app.js</text><text x="392" y="184" fill="#8b949e" font-size="10" text-anchor="end">112</text>
  </g>
  <text x="240" y="420" fill="#5c5f6b" font-size="9" font-family="ui-monospace,Menlo,monospace">numbers = cyclomatic complexity</text>

  <!-- scc pane -->
  <rect x="410" y="56" width="490" height="384" fill="#1b1d21"/>
  <line x1="410" y1="56" x2="410" y2="440" stroke="#2e3037"/>
  <!-- head: dropdown + buttons -->
  <rect x="420" y="62" width="150" height="20" rx="3" fill="#23262b" stroke="#333"/><text x="428" y="76" fill="#cfd3d8" font-size="11">Language table ▾</text>
  <rect x="578" y="62" width="22" height="20" rx="3" fill="#2b2f34"/><text x="585" y="76" fill="#cfd3d8" font-size="11">⟳</text>
  <rect x="606" y="62" width="22" height="20" rx="3" fill="#238636"/><text x="612" y="76" fill="#fff" font-size="11">⏱</text>
  <rect x="634" y="62" width="52" height="20" rx="3" fill="#2b2f34"/><text x="642" y="76" fill="#cfd3d8" font-size="11">Report</text>
