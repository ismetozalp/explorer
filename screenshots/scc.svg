  <!-- terminal -->
  <rect x="0" y="56" width="230" height="384" fill="#0d1013"/>
  <text x="12" y="80" fill="#6ee7b7" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">~/project $ claude</text>
  <text x="12" y="100" fill="#9aa0a8" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">● Editing files …</text>

