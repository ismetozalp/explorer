<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="440" fill="#1b1d21"/>
  <!-- tab bar -->
  <rect x="0" y="0" width="900" height="30" fill="#141517"/>
  <rect x="8" y="5" width="120" height="20" rx="4" fill="#23262b"/><text x="18" y="19" fill="#cfd3d8" font-size="11">✦ claude</text>
  <text x="740" y="19" fill="#8ab4f8" font-size="11">✦ AI ▾</text>
  <!-- sub-tab bar -->
  <rect x="0" y="30" width="900" height="26" fill="#202226"/>
  <rect x="8" y="34" width="90" height="18" rx="3" fill="#2b3138"/><text x="16" y="47" fill="#e8e8e8" font-size="11">✦ claude</text>
  <text x="856" y="47" fill="#8ab4f8" font-size="12">✦</text>

  <!-- ── terminal (left) ── -->
  <rect x="0" y="56" width="290" height="384" fill="#0d1013"/>
  <text x="12" y="80" fill="#6ee7b7" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">~/project $ claude</text>
  <text x="12" y="100" fill="#cfd3d8" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">╭─ Claude Code ──────╮</text>
  <text x="12" y="118" fill="#cfd3d8" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">│ &gt; refactor parser │</text>
  <text x="12" y="136" fill="#cfd3d8" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">╰────────────────────╯</text>
  <text x="12" y="160" fill="#9aa0a8" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">● Editing files …</text>

  <!-- ── repo tree (middle) ── -->
  <rect x="290" y="56" width="250" height="384" fill="#1b1d21"/>
  <line x1="290" y1="56" x2="290" y2="440" stroke="#2e3037"/>
  <rect x="290" y="56" width="250" height="28" fill="#1b1d21"/>
  <line x1="290" y1="84" x2="540" y2="84" stroke="#2e3037"/>
  <text x="302" y="75" fill="#8b949e" font-size="11" letter-spacing="0.6">REPO</text>
  <rect x="514" y="61" width="20" height="18" rx="3" fill="#23262b"/><text x="520" y="74" fill="#cfd3d8" font-size="11">◀</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">
    <!-- ▾ project (root) -->
    <text x="300" y="104" fill="#8b949e">▾</text><text x="316" y="104" fill="#cfd3d8">project</text>
    <!-- ▸ src  (folder containing changes → blue tint) -->
    <text x="314" y="124" fill="#8b949e">▸</text><text x="330" y="124" fill="#58a6ff">src</text>
    <!-- expanded file under src: parser.js modified (blue) -->
    <text x="344" y="144" fill="#58a6ff">parser.js</text>
    <text x="344" y="164" fill="#cfd3d8">lexer.js</text>
    <!-- ▸ tests  (dir-dirty) -->
    <text x="314" y="184" fill="#8b949e">▸</text><text x="330" y="184" fill="#58a6ff">tests</text>
    <!-- README.md modified (blue) — this row is "hovered": shows the actions -->
    <rect x="290" y="192" width="250" height="18" fill="#2b2f34"/>
    <text x="316" y="206" fill="#58a6ff">README.md</text>
    <text x="470" y="206" fill="#cfd3d8" font-size="11">±</text>
    <text x="490" y="206" fill="#cfd3d8" font-size="11">👁</text>
    <text x="514" y="206" fill="#cfd3d8" font-size="11">✎</text>
    <!-- newfile.js added/new (green) -->
    <text x="316" y="226" fill="#56d364">newfile.js</text>
    <!-- notes.txt untracked / not in repo (red) -->
    <text x="316" y="246" fill="#f85149">notes.txt</text>
    <!-- clean files (default) -->
    <text x="316" y="266" fill="#cfd3d8">package.json</text>
    <text x="316" y="286" fill="#cfd3d8">Makefile</text>
  </g>
  <!-- legend -->
  <text x="300" y="410" fill="#58a6ff" font-size="10" font-family="ui-monospace,Menlo,monospace">■ modified</text>
  <text x="382" y="410" fill="#56d364" font-size="10" font-family="ui-monospace,Menlo,monospace">■ new</text>
  <text x="436" y="410" fill="#f85149" font-size="10" font-family="ui-monospace,Menlo,monospace">■ untracked</text>

  <!-- ── diff (right) ── -->
  <rect x="540" y="56" width="360" height="384" fill="#16171b"/>
  <line x1="540" y1="56" x2="540" y2="440" stroke="#2e3037"/>
  <rect x="540" y="56" width="360" height="28" fill="#1e2027"/>
  <rect x="550" y="61" width="34" height="18" rx="3" fill="#0d6efd"/><text x="557" y="74" fill="#fff" font-size="11">All</text>
  <rect x="588" y="61" width="60" height="18" rx="3" fill="#2b2f34"/><text x="595" y="74" fill="#cfd3d8" font-size="11">Unstaged</text>
  <rect x="866" y="61" width="24" height="18" rx="3" fill="#2b2f34"/><text x="873" y="74" fill="#cfd3d8" font-size="11">▶</text>
  <line x1="540" y1="84" x2="900" y2="84" stroke="#2e3037"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">
    <text x="556" y="104" fill="#8b949e">diff --git a/js/parser.js b/js/parser.js</text>
    <rect x="540" y="109" width="360" height="15" fill="#58a6ff" opacity="0.10"/>
    <text x="556" y="120" fill="#58a6ff">@@ -12,7 +12,9 @@ function parse(src) {</text>
    <text x="550" y="136" fill="#6b7280">12</text><text x="572" y="136" fill="#6b7280">12</text><text x="596" y="136" fill="#cfd3d8"> const tokens = lex(src);</text>
    <rect x="540" y="141" width="360" height="15" fill="#f85149" opacity="0.15"/>
    <text x="550" y="152" fill="#6b7280">13</text><text x="596" y="152" fill="#f85149">-  return tokens.map(naive);</text>
    <rect x="540" y="157" width="360" height="15" fill="#3fb950" opacity="0.15"/>
    <text x="572" y="168" fill="#6b7280">13</text><text x="596" y="168" fill="#56d364">+  const ast = build(tokens);</text>
  </g>

  <text x="12" y="430" fill="#5c5f6b" font-size="11">Terminal · repo tree (git-status colors; click a file to show its diff, 👁 preview, ✎ edit) · live diff</text>
</svg>
