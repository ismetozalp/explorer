<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="420" fill="#1b1d21"/>
  <!-- file list with a folder row highlighted as drop target -->
  <rect x="0" y="0" width="900" height="26" fill="#23262b"/>
  <text x="16" y="18" fill="#8b93a0" font-size="12">NAME</text><text x="560" y="18" fill="#8b93a0" font-size="12">SIZE</text>
  <g font-size="12.5">
    <text x="16" y="52" fill="#cfd3d8">📁 archive</text>
    <!-- highlighted drop target folder -->
    <rect x="0" y="66" width="900" height="28" fill="#1f3a2a" stroke="#2f9e5c"/>
    <text x="16" y="85" fill="#a8e6bf">📂 releases   ⬅ drop into this folder</text>
    <text x="16" y="120" fill="#cfd3d8">📄 build.log</text>
    <text x="16" y="148" fill="#e8e8e8">📄 app-2.0.1.tar.gz</text><text x="560" y="148" fill="#8b93a0">14 MB</text>
  </g>
  <!-- dragged file ghost -->
  <rect x="330" y="120" width="180" height="24" rx="4" fill="#2b3138" stroke="#3d4147" opacity="0.92"/>
  <text x="344" y="137" fill="#cfd3d8" font-size="12">📄 app-2.0.1.tar.gz</text>

  <!-- Drop-action modal (Move/Copy + rename-on-drop) -->
  <rect x="470" y="150" width="380" height="230" rx="8" fill="#292d31" stroke="#444649"/>
  <rect x="470" y="150" width="380" height="40" rx="8" fill="#23262b"/>
  <rect x="470" y="182" width="380" height="8" fill="#23262b"/>
  <text x="490" y="176" fill="#f0f0f0" font-size="14" font-weight="bold">Drop action</text>
  <text x="490" y="216" fill="#cfd3d8" font-size="12">Move or copy 1 item into “releases”?</text>
  <text x="490" y="244" fill="#9aa0a8" font-size="12">Name at destination</text>
  <rect x="490" y="252" width="340" height="26" rx="4" fill="#1b1d21" stroke="#3d4147"/>
  <text x="502" y="269" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e8e8">app-2.0.1.tar.gz</text>
  <text x="490" y="298" fill="#6f7681" font-size="11">rename here to rename on drop</text>
  <rect x="614" y="326" width="76" height="30" rx="4" fill="#3a3f45"/>
  <text x="634" y="346" fill="#e8e8e8" font-size="12">Copy</text>
  <rect x="700" y="326" width="130" height="30" rx="4" fill="#0d6efd"/>
  <text x="726" y="346" fill="#fff" font-size="12">Move here</text>
</svg>
