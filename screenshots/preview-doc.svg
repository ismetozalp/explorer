<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="520" fill="#1b1d21"/>
  <rect width="900" height="520" fill="#000" opacity="0.45"/>

  <!-- modal -->
  <rect x="70" y="34" width="760" height="452" rx="8" fill="#292d31" stroke="#444649"/>
  <rect x="70" y="34" width="760" height="44" rx="8" fill="#23262b"/>
  <rect x="70" y="68" width="760" height="10" fill="#23262b"/>
  <text x="92" y="62" fill="#f0f0f0" font-size="14" font-weight="bold">quarterly-notes.md</text>

  <!-- header controls: Rendered/Source toggle + nav + minimize/maximize/close -->
  <rect x="470" y="46" width="72" height="20" rx="4" fill="#33373c" stroke="#4a4e54"/>
  <text x="506" y="61" fill="#e5e7eb" font-size="12" text-anchor="middle">Source</text>
  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
    <rect x="556" y="46" width="24" height="20" rx="4" fill="#33373c" stroke="#4a4e54"/>
    <text x="568" y="61" fill="#c7ccd2" text-anchor="middle">◀</text>
    <text x="616" y="61" fill="#a6a6a6" text-anchor="middle">3 / 5</text>
    <rect x="646" y="46" width="24" height="20" rx="4" fill="#33373c" stroke="#4a4e54"/>
    <text x="658" y="61" fill="#f0f0f0" text-anchor="middle">▶</text>
  </g>
  <text x="770" y="63" fill="#a6a6a6" font-size="15">–  ▢  ×</text>
  <line x1="70" y1="78" x2="830" y2="78" stroke="#444649"/>

  <!-- rendered-document surface (sandboxed iframe, white page like a real doc) -->
  <rect x="70" y="78" width="760" height="408" fill="#fdfdfd"/>

  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="112" y="126" fill="#111" font-size="22" font-weight="bold">Quarterly Notes</text>
    <line x1="112" y1="138" x2="748" y2="138" stroke="#ddd"/>
    <text x="112" y="168" fill="#333" font-size="13">Summary of the migration rollout and what's left before the</text>
    <text x="112" y="186" fill="#333" font-size="13">next release cuts.</text>
    <text x="112" y="216" fill="#111" font-size="16" font-weight="bold">Status</text>
    <text x="128" y="240" fill="#333" font-size="13">•  Preview navigation — done</text>
    <text x="128" y="258" fill="#333" font-size="13">•  Video transcoding — done</text>
    <text x="128" y="276" fill="#333" font-size="13">•  Rendered documents — done</text>

    <!-- a small rendered table, standing in for the .xlsx/.csv sheet view -->
    <text x="112" y="312" fill="#111" font-size="16" font-weight="bold">Sheet: totals</text>
    <g font-size="12" fill="#222">
      <rect x="112" y="326" width="636" height="26" fill="#f1f1f1" stroke="#ccc"/>
      <text x="122" y="343">Q1</text><text x="282" y="343">Q2</text><text x="442" y="343">Q3</text>
      <rect x="112" y="352" width="636" height="26" fill="#fff" stroke="#ccc"/>
      <text x="122" y="369">128</text><text x="282" y="369">154</text><text x="442" y="369">171</text>
    </g>
  </g>

  <!-- callout -->
  <rect x="470" y="392" width="330" height="78" rx="7" fill="#23262b" stroke="#3d4147" opacity="0.95"/>
  <text x="486" y="415" fill="#f0f0f0" font-size="12.5" font-weight="bold">Rendered documents (3.0)</text>
  <text x="486" y="435" fill="#c7ccd2" font-size="11.5">Markdown (Rendered ⇄ Source), .docx and</text>
  <text x="486" y="451" fill="#c7ccd2" font-size="11.5">.xlsx/.xls/.ods/.csv render in a sandboxed frame.</text>
</svg>
