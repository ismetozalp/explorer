<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="380" fill="#1b1d21"/>
  <rect width="900" height="380" fill="#000" opacity="0.4"/>

  <!-- context menu (extract) on the left -->
  <rect x="40" y="60" width="220" height="150" rx="7" fill="#292d31" stroke="#4a4e53"/>
  <g font-size="12.5" fill="#cfd3d8">
    <text x="58" y="86">Open</text>
    <line x1="40" y1="98" x2="260" y2="98" stroke="#3d4147"/>
    <rect x="40" y="104" width="220" height="24" fill="#31363c"/>
    <text x="58" y="121" fill="#e8e8e8">Compress…</text>
    <text x="58" y="149">Extract here</text>
    <text x="58" y="177">Extract to…</text>
    <line x1="40" y1="188" x2="260" y2="188" stroke="#3d4147"/>
    <text x="58" y="205">Download</text>
  </g>
  <text x="58" y="235" fill="#6f7681" font-size="11">on any .zip/.tar* file</text>

  <!-- Compress modal -->
  <rect x="330" y="50" width="420" height="280" rx="8" fill="#292d31" stroke="#444649"/>
  <rect x="330" y="50" width="420" height="42" rx="8" fill="#23262b"/>
  <rect x="330" y="84" width="420" height="8" fill="#23262b"/>
  <text x="352" y="76" fill="#f0f0f0" font-size="14" font-weight="bold">Compress</text>
  <text x="722" y="76" fill="#a6a6a6" font-size="15">×</text>

  <text x="352" y="118" fill="#9aa0a8" font-size="12">Archive name</text>
  <rect x="352" y="126" width="376" height="28" rx="4" fill="#1b1d21" stroke="#3d4147"/>
  <text x="364" y="145" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e8e8">release-2.0.1</text>

  <text x="352" y="182" fill="#9aa0a8" font-size="12">Format</text>
  <g font-size="12">
    <rect x="352" y="190" width="70" height="26" rx="4" fill="#0d6efd"/><text x="372" y="207" fill="#fff">zip</text>
    <rect x="428" y="190" width="70" height="26" rx="4" fill="#2b2f34" stroke="#3d4147"/><text x="446" y="207" fill="#cfd3d8">tar</text>
    <rect x="504" y="190" width="80" height="26" rx="4" fill="#2b2f34" stroke="#3d4147"/><text x="516" y="207" fill="#cfd3d8">tar.gz</text>
    <rect x="590" y="190" width="66" height="26" rx="4" fill="#2b2f34" stroke="#3d4147"/><text x="600" y="207" fill="#cfd3d8">.bz2</text>
    <rect x="662" y="190" width="66" height="26" rx="4" fill="#2b2f34" stroke="#3d4147"/><text x="674" y="207" fill="#cfd3d8">.xz</text>
  </g>
  <text x="352" y="244" fill="#6f7681" font-size="11">Compresses the selected files into the current folder.</text>

  <rect x="352" y="286" width="14" height="14" rx="3" fill="#1b1d21" stroke="#3d4147"/>
  <text x="376" y="298" fill="#cfd3d8" font-size="12">2 items selected</text>
  <rect x="632" y="282" width="96" height="30" rx="4" fill="#0d6efd"/>
  <text x="650" y="302" fill="#fff" font-size="13">Compress</text>
</svg>
