<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="520" fill="#1b1d21"/>

  <!-- toolbar -->
  <rect x="0" y="0" width="900" height="38" fill="#23262b"/>
  <rect x="12" y="8" width="150" height="22" rx="4" fill="#2b2f34" stroke="#3d4147"/>
  <text x="24" y="24" fill="#e8e8e8" font-size="13" letter-spacing="3">←  →  ↑  ⌂  ⟳</text>
  <rect x="174" y="8" width="74" height="22" rx="4" fill="#0d6efd"/>
  <text x="188" y="24" fill="#fff" font-size="12">⊞ Single</text>
  <rect x="720" y="8" width="70" height="22" rx="4" fill="#0d6efd"/>
  <text x="734" y="24" fill="#fff" font-size="12">▤ Term</text>

  <!-- ===== TWO FILE PANES (top) ===== -->
  <!-- left pane (active) -->
  <rect x="6" y="44" width="440" height="252" fill="#202327" stroke="#2b2f34"/>
  <rect x="6" y="44" width="440" height="3" fill="#3b82f6"/>
  <rect x="6" y="47" width="440" height="22" fill="#23262b"/>
  <text x="18" y="63" fill="#9aa0a8" font-size="11">↑ ⟳  / home / ismet / app</text>
  <g font-size="12.5">
    <rect x="6" y="76" width="440" height="22" fill="#2b3138"/>
    <text x="20" y="92" fill="#e8e8e8">📁 src</text>
    <text x="20" y="118" fill="#cfd3d8">📁 tests</text>
    <text x="20" y="144" fill="#cfd3d8">📄 package.json</text>
    <text x="20" y="170" fill="#cfd3d8">📄 Dockerfile</text>
    <text x="20" y="196" fill="#cfd3d8">📄 README.md</text>
  </g>
  <!-- right pane -->
  <rect x="454" y="44" width="440" height="252" fill="#1e2125" stroke="#2b2f34"/>
  <rect x="454" y="47" width="440" height="22" fill="#23262b"/>
  <text x="466" y="63" fill="#9aa0a8" font-size="11">↑ ⟳  / srv / infra</text>
  <g font-size="12.5">
    <text x="468" y="92" fill="#cfd3d8">📁 ansible</text>
    <text x="468" y="118" fill="#cfd3d8">📁 k8s</text>
    <text x="468" y="144" fill="#cfd3d8">📄 deploy.sh</text>
    <text x="468" y="170" fill="#cfd3d8">📄 hosts.ini</text>
  </g>

  <!-- resize divider -->
  <rect x="6" y="298" width="888" height="8" fill="#3a3f45"/>
  <rect x="436" y="300" width="28" height="4" rx="2" fill="#6b7178"/>

  <!-- ===== TERMINAL PANE (bottom, full width) ===== -->
  <!-- sub-tab bar (blue accent = plain terminal) -->
  <rect x="6" y="308" width="888" height="26" fill="#202327"/>
  <rect x="6" y="308" width="4" height="26" fill="#3b82f6"/>
  <rect x="6" y="308" width="888" height="26" fill="#3b82f6" opacity="0.06"/>
  <rect x="16" y="311" width="120" height="20" rx="4" fill="#2b3138" stroke="#3b82f6"/>
  <rect x="16" y="329" width="120" height="2" fill="#3b82f6"/>
  <text x="26" y="326" fill="#fff" font-size="11">❯ ~/app</text>
  <rect x="142" y="311" width="120" height="20" rx="4" fill="#1b1d21" stroke="#3a3f45"/>
  <text x="152" y="326" fill="#cfd3d8" font-size="11">❯ ~/app/src</text>
  <rect x="268" y="311" width="26" height="20" rx="4" fill="#1b1d21" stroke="#3a3f45"/>
  <text x="277" y="326" fill="#3b82f6" font-size="13">+</text>
  <text x="872" y="326" fill="#9aa0a8" font-size="13">×</text>
  <text x="640" y="326" fill="#5f6b7a" font-size="10">terminal docks under both panes · drag divider to resize</text>

  <!-- terminal body -->
  <rect x="6" y="334" width="888" height="182" fill="#121417"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
    <text x="20" y="360" fill="#7fd18a">ismet@host</text><text x="105" y="360" fill="#6f7681">:</text><text x="114" y="360" fill="#6ea6ff">~/app</text><text x="158" y="360" fill="#cfd3d8">$ npm run build</text>
    <text x="20" y="384" fill="#8b93a0">  vite v5 building for production...</text>
    <text x="20" y="406" fill="#8b93a0">  ✓ 214 modules transformed.</text>
    <text x="20" y="428" fill="#8b93a0">  dist/index.html            1.2 kB</text>
    <text x="20" y="450" fill="#8b93a0">  dist/assets/index-8f3.js  142 kB</text>
    <text x="20" y="472" fill="#7ec699">  ✓ built in 3.41s</text>
    <text x="20" y="498" fill="#7fd18a">ismet@host</text><text x="105" y="498" fill="#6f7681">:</text><text x="114" y="498" fill="#6ea6ff">~/app</text><text x="158" y="498" fill="#cfd3d8">$ █</text>
  </g>
</svg>
