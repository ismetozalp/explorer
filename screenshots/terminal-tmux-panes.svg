<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="520" fill="#1b1d21"/>

  <!-- main tab bar -->
  <rect x="0" y="0" width="900" height="40" fill="#23262b"/>
  <!-- plain terminal main tab (blue) -->
  <rect x="16" y="8" width="150" height="32" rx="6" fill="#292d31" stroke="#3d4147"/>
  <rect x="16" y="8" width="4" height="32" rx="2" fill="#60a5fa"/>
  <text x="34" y="29" fill="#e8e8e8" font-size="13">❯ Terminal</text>
  <!-- tmux main tab (green, active) -->
  <rect x="174" y="8" width="150" height="32" rx="6" fill="#31363c" stroke="#4a5560"/>
  <rect x="174" y="8" width="4" height="32" rx="2" fill="#22c55e"/>
  <text x="192" y="29" fill="#ffffff" font-size="13">⧉ build</text>
  <!-- a dir tab -->
  <rect x="332" y="8" width="120" height="32" rx="6" fill="#23262b"/>
  <text x="348" y="29" fill="#a6a6a6" font-size="13">/srv/app</text>
  <text x="470" y="29" fill="#7a7a7a" font-size="16">+</text>

  <!-- ===== tmux tab body ===== -->
  <!-- sub-tab bar (pane header) with green accent -->
  <rect x="0" y="48" width="900" height="34" fill="#202327"/>
  <rect x="0" y="48" width="4" height="34" fill="#22c55e"/>
  <rect x="0" y="48" width="900" height="34" fill="#22c55e" opacity="0.06"/>
  <!-- session sub-tabs -->
  <rect x="16" y="54" width="86" height="24" rx="4" fill="#1b1d21" stroke="#3a3f45"/>
  <text x="26" y="70" fill="#cfcfcf" font-size="12">⧉ main</text>
  <rect x="110" y="54" width="86" height="24" rx="4" fill="#2b3138" stroke="#22c55e"/>
  <rect x="110" y="76" width="86" height="2" fill="#22c55e"/>
  <text x="120" y="70" fill="#ffffff" font-size="12">⧉ build</text>
  <rect x="204" y="54" width="82" height="24" rx="4" fill="#1b1d21" stroke="#3a3f45"/>
  <text x="214" y="70" fill="#cfcfcf" font-size="12">⧉ logs</text>
  <rect x="294" y="54" width="26" height="24" rx="4" fill="#1b1d21" stroke="#3a3f45"/>
  <text x="303" y="71" fill="#22c55e" font-size="15">+</text>
  <text x="470" y="70" fill="#5f6b60" font-size="11">+ on a tmux tab opens a new tmux session</text>

  <!-- terminal body -->
  <rect x="0" y="82" width="900" height="438" fill="#121417"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="18" y="112" fill="#7fd18a">user@host</text><text x="94" y="112" fill="#6f7681">:</text><text x="104" y="112" fill="#6ea6ff">~/srv/app</text><text x="176" y="112" fill="#cfd3d8">$ tmux attach -t build</text>
    <text x="18" y="140" fill="#cfd3d8">[build] running: podman-compose up -d --build</text>
    <text x="18" y="164" fill="#8b93a0">  Building app ... done</text>
    <text x="18" y="188" fill="#8b93a0">  Recreating app_web_1 ... done</text>
    <text x="18" y="212" fill="#8b93a0">  Recreating app_db_1  ... done</text>
    <text x="18" y="240" fill="#7fd18a">user@host</text><text x="94" y="240" fill="#6f7681">:</text><text x="104" y="240" fill="#6ea6ff">~/srv/app</text><text x="176" y="240" fill="#cfd3d8">$ █</text>
  </g>

  <!-- legend -->
  <rect x="560" y="360" width="320" height="140" rx="8" fill="#292d31" stroke="#3d4147"/>
  <text x="580" y="388" fill="#f0f0f0" font-size="13" font-weight="bold">Terminal vs tmux panes</text>
  <rect x="580" y="404" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text x="602" y="416" fill="#cfd3d8" font-size="12">❯  plain terminal — + opens a new shell</text>
  <rect x="580" y="428" width="14" height="14" rx="3" fill="#22c55e"/>
  <text x="602" y="440" fill="#cfd3d8" font-size="12">⧉  tmux — sessions grouped as sub-tabs</text>
  <text x="580" y="470" fill="#9aa0a8" font-size="11">Colour + icon on the tab title and the</text>
  <text x="580" y="486" fill="#9aa0a8" font-size="11">pane header tell the two kinds apart.</text>
</svg>
