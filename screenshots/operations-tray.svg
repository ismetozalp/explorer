<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="360" fill="#1b1d21"/>
  <!-- faint file list behind -->
  <g opacity="0.4" font-size="12.5" fill="#cfd3d8">
    <rect x="0" y="0" width="900" height="26" fill="#23262b"/>
    <text x="16" y="50">📁 data</text><text x="16" y="80">📄 dump.sql</text><text x="16" y="110">📄 photos.zip</text>
  </g>

  <!-- operations tray, bottom-right -->
  <rect x="536" y="120" width="348" height="222" rx="8" fill="#23262b" stroke="#444649"/>
  <rect x="536" y="120" width="348" height="34" rx="8" fill="#292d31"/>
  <rect x="536" y="146" width="348" height="8" fill="#292d31"/>
  <text x="554" y="142" fill="#f0f0f0" font-size="13" font-weight="bold">Operations (2 running)</text>
  <text x="864" y="142" fill="#a6a6a6" font-size="14">×</text>

  <!-- op 1: copy, running -->
  <text x="554" y="176" fill="#cfd3d8" font-size="12">Copy → /srv/backups</text>
  <text x="850" y="176" fill="#8b93a0" font-size="11" text-anchor="end">×</text>
  <rect x="554" y="184" width="296" height="8" rx="4" fill="#2b2f34"/>
  <rect x="554" y="184" width="196" height="8" rx="4" fill="#0d6efd"/>
  <text x="554" y="206" fill="#7f8792" font-size="10">1.9 GB / 2.9 GB · 74 MB/s · ETA 14s</text>

  <!-- op 2: upload, running -->
  <text x="554" y="234" fill="#cfd3d8" font-size="12">Upload photos/ (312 files)</text>
  <text x="850" y="234" fill="#8b93a0" font-size="11" text-anchor="end">×</text>
  <rect x="554" y="242" width="296" height="8" rx="4" fill="#2b2f34"/>
  <rect x="554" y="242" width="120" height="8" rx="4" fill="#0d6efd"/>

  <!-- op 3: failed → retry as admin -->
  <text x="554" y="286" fill="#e2777a" font-size="12">Write /etc/nginx/... — Permission denied</text>
  <rect x="554" y="296" width="176" height="26" rx="4" fill="#8a5a00"/>
  <text x="566" y="313" fill="#ffe1a8" font-size="11">↑ Retry as administrator</text>
</svg>
