  <text x="700" y="168" fill="#8b949e" font-size="11">16m ago</text>
  <rect x="760" y="156" width="66" height="18" rx="3" fill="#2b2f34"/><text x="768" y="169" fill="#cfd3d8" font-size="10">Resume</text>
  <text x="838" y="169" fill="#8b949e" font-size="11">🗑</text>
