  <text x="50" y="274" fill="#cfd3d8" font-size="12" font-family="ui-monospace,Menlo,monospace">/home/ismet/cockpit_projects/manifest</text>
  <rect x="360" y="263" width="26" height="16" rx="8" fill="#3a3f46"/><text x="367" y="275" fill="#cfd3d8" font-size="10">10</text>
