<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="440" fill="#1b1d21"/>
  <!-- streaming output tab behind -->
  <rect x="0" y="0" width="900" height="30" fill="#23262b"/>
  <rect x="14" y="5" width="150" height="22" rx="4" fill="#2b2f34"/>
  <text x="26" y="20" fill="#cfd3d8" font-size="12">▶ podman ps</text>
  <rect x="0" y="30" width="900" height="410" fill="#121417"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">
    <text x="16" y="56" fill="#8b93a0">$ podman ps --format '{{.Names}}  {{.Status}}'</text>
    <text x="16" y="78" fill="#cfd3d8">app_web_1     Up 3 hours</text>
    <text x="16" y="100" fill="#cfd3d8">app_db_1      Up 3 hours</text>
    <text x="16" y="122" fill="#cfd3d8">app_cache_1   Up 3 hours</text>
    <text x="16" y="144" fill="#7ec699">— done (exit 0) —</text>
  </g>

  <!-- Run command modal -->
  <rect x="240" y="60" width="420" height="300" rx="8" fill="#292d31" stroke="#444649"/>
  <rect x="240" y="60" width="420" height="42" rx="8" fill="#23262b"/>
  <rect x="240" y="94" width="420" height="8" fill="#23262b"/>
  <text x="262" y="86" fill="#f0f0f0" font-size="14" font-weight="bold">Run command</text>
  <text x="632" y="86" fill="#a6a6a6" font-size="15">×</text>
  <text x="262" y="126" fill="#9aa0a8" font-size="12">Command  (Ctrl-Enter to run)</text>
  <rect x="262" y="134" width="376" height="70" rx="4" fill="#1b1d21" stroke="#3d4147"/>
  <text x="274" y="156" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e8e8">podman ps --format \</text>
  <text x="274" y="176" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e8e8">  '{{.Names}}  {{.Status}}'</text>
  <text x="262" y="230" fill="#9aa0a8" font-size="12">Shell</text>
  <rect x="262" y="238" width="180" height="26" rx="4" fill="#1b1d21" stroke="#3d4147"/>
  <text x="274" y="255" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#e8e8e8">/bin/bash  ▾</text>
  <rect x="262" y="280" width="14" height="14" rx="3" fill="#1b1d21" stroke="#3d4147"/>
  <text x="286" y="292" fill="#cfd3d8" font-size="12">Run as administrator</text>
  <rect x="546" y="316" width="92" height="28" rx="4" fill="#0d6efd"/>
  <text x="566" y="335" fill="#fff" font-size="13">Run ▶</text>
  <text x="262" y="335" fill="#6f7681" font-size="11">output streams into a new tab →</text>
</svg>
