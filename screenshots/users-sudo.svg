<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="440" fill="#1b1d21"/>
  <!-- modal -->
  <rect x="30" y="20" width="840" height="400" rx="8" fill="#23262b" stroke="#3d4147"/>
  <!-- header -->
  <text x="52" y="52" fill="#e8e8e8" font-size="16" font-weight="bold">Users &amp; sudo</text>
  <rect x="700" y="34" width="80" height="24" rx="4" fill="#2b2f34"/><text x="716" y="51" fill="#cfd3d8" font-size="12">Refresh</text>
  <text x="828" y="52" fill="#9aa0a8" font-size="16">✕</text>
  <line x1="30" y1="68" x2="870" y2="68" stroke="#3d4147"/>

  <!-- create user form -->
  <text x="52" y="92" fill="#9aa0a8" font-size="11">CREATE USER</text>
  <rect x="52" y="102" width="200" height="28" rx="4" fill="#2b2f34" stroke="#444649"/><text x="64" y="120" fill="#7f8792" font-size="12">alice</text>
  <rect x="264" y="102" width="200" height="28" rx="4" fill="#2b2f34" stroke="#444649"/><text x="276" y="120" fill="#7f8792" font-size="12">••••••••</text>
  <text x="480" y="114" fill="#cfd3d8" font-size="12">☐ Grant sudo</text>
  <text x="480" y="130" fill="#cfd3d8" font-size="12">☐ Passwordless sudo</text>
  <rect x="640" y="102" width="96" height="28" rx="4" fill="#0d6efd"/><text x="656" y="120" fill="#fff" font-size="12">Create user</text>

  <!-- table header -->
  <line x1="52" y1="150" x2="848" y2="150" stroke="#3d4147"/>
  <g font-size="11" fill="#9aa0a8">
    <text x="60" y="170">User</text><text x="250" y="170">UID</text><text x="330" y="170">sudo</text>
    <text x="430" y="170">Passwordless</text><text x="770" y="170">Actions</text>
  </g>
  <line x1="52" y1="180" x2="848" y2="180" stroke="#2b3138"/>

  <g font-size="12.5">
    <!-- row: you (admin, passwordless) -->
    <rect x="52" y="184" width="796" height="46" fill="#2b3138"/>
    <text x="60" y="212" fill="#e8e8e8" font-weight="bold">ismet</text>
    <rect x="108" y="200" width="34" height="16" rx="8" fill="#495057"/><text x="114" y="212" fill="#e8e8e8" font-size="10">you</text>
    <text x="250" y="212" fill="#9aa0a8">1000</text>
    <rect x="330" y="200" width="34" height="16" rx="8" fill="#1a7f37"/><text x="338" y="212" fill="#fff" font-size="10">yes</text>
    <rect x="430" y="200" width="80" height="16" rx="8" fill="#9a6700"/><text x="438" y="212" fill="#fff" font-size="10">NOPASSWD</text>
    <text x="640" y="212" fill="#7f8792" font-size="11">Revoke · Require pw · Password…</text>

    <!-- row: alice (admin) -->
    <text x="60" y="256" fill="#cfd3d8" font-weight="bold">alice</text>
    <text x="250" y="256" fill="#9aa0a8">1001</text>
    <rect x="330" y="244" width="34" height="16" rx="8" fill="#1a7f37"/><text x="338" y="256" fill="#fff" font-size="10">yes</text>
    <rect x="430" y="244" width="18" height="16" rx="8" fill="#495057"/><text x="436" y="256" fill="#cfd3d8" font-size="10">—</text>
    <text x="600" y="256" fill="#7f8792" font-size="11">Revoke · Passwordless · Password… · Delete</text>

    <!-- row: bob (no sudo) -->
    <text x="60" y="298" fill="#cfd3d8" font-weight="bold">bob</text>
    <text x="250" y="298" fill="#9aa0a8">1002</text>
    <rect x="330" y="286" width="26" height="16" rx="8" fill="#495057"/><text x="337" y="298" fill="#cfd3d8" font-size="10">no</text>
    <rect x="430" y="286" width="18" height="16" rx="8" fill="#495057"/><text x="436" y="298" fill="#cfd3d8" font-size="10">—</text>
    <text x="600" y="298" fill="#7f8792" font-size="11">Grant sudo · Passwordless · Password… · Delete</text>

    <!-- row: carol (no sudo) -->
    <text x="60" y="340" fill="#cfd3d8" font-weight="bold">carol</text>
    <text x="250" y="340" fill="#9aa0a8">1003</text>
    <rect x="330" y="328" width="26" height="16" rx="8" fill="#495057"/><text x="337" y="340" fill="#cfd3d8" font-size="10">no</text>
    <rect x="430" y="328" width="18" height="16" rx="8" fill="#495057"/><text x="436" y="340" fill="#cfd3d8" font-size="10">—</text>
    <text x="600" y="340" fill="#7f8792" font-size="11">Grant sudo · Passwordless · Password… · Delete</text>
  </g>

  <line x1="52" y1="360" x2="848" y2="360" stroke="#3d4147"/>
  <text x="52" y="384" fill="#7f8792" font-size="11">sudo is granted via the wheel group. Passwordless sudo writes a visudo-validated,</text>
  <text x="52" y="400" fill="#7f8792" font-size="11">app-managed /etc/sudoers.d/90-explorer-&lt;user&gt; drop-in. /etc/sudoers is never edited.</text>
</svg>
