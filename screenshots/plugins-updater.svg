<svg xmlns="http://www.w3.org/2000/svg" width="900" height="592" viewBox="0 0 900 592" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="592" fill="#1b1d21"/>

  <!-- faint toolbar strip behind the modal -->
  <g opacity="0.4" font-size="12">
    <rect x="0" y="0" width="900" height="22" fill="#23262b"/>
    <text x="16" y="15" fill="#8b93a0">Explorer</text>
    <text x="760" y="15" fill="#8b93a0">⬆ Plugins</text>
    <text x="830" y="15" fill="#8b93a0">⛁ Mounts</text>
  </g>

  <!-- modal panel -->
  <rect x="60" y="30" width="780" height="532" rx="10" fill="#292d31" stroke="#4a4e53"/>

  <!-- title bar -->
  <text x="84" y="62" fill="#f0f0f0" font-size="20" font-weight="bold">Plugin Manager</text>
  <text x="800" y="62" fill="#9aa0a8" font-size="20">×</text>
  <line x1="60" y1="78" x2="840" y2="78" stroke="#3d4147"/>

  <!-- toolbar row: check for updates + force reinstall -->
  <rect x="84" y="90" width="170" height="32" rx="6" fill="#31363c" stroke="#4a4e53"/>
  <text x="100" y="111" fill="#e8e8e8" font-size="13">Check for updates</text>
  <rect x="280" y="98" width="16" height="16" rx="3" fill="#1b1d21" stroke="#6a6f76"/>
  <text x="306" y="111" fill="#cfd3d8" font-size="13">Force reinstall</text>

  <line x1="60" y1="134" x2="840" y2="134" stroke="#3d4147"/>

  <!-- table header: Plugin · Repo · Version · Status · Action -->
  <g font-size="12" fill="#8b93a0">
    <text x="118" y="154">Plugin</text>
    <text x="236" y="154">Repo</text>
    <text x="400" y="154">Version</text>
    <text x="536" y="154">Status</text>
    <text x="757" y="154">Action</text>
  </g>

  <!-- row 1: Explorer — up to date -->
  <g font-size="13">
    <text x="118" y="187" fill="#e8e8e8">Explorer</text>
    <text x="236" y="186" fill="#9aa0a8" font-size="12">ismetozalp/explorer</text>
    <text x="400" y="186" fill="#cfd3d8" font-size="12">2.4.1</text>
  </g>
  <rect x="536" y="172" width="104" height="20" rx="10" fill="#198754"/>
  <text x="546" y="186" fill="#fff" font-size="11">✓ Up to date</text>

  <!-- row 2: Cockpit Top — update available (highlighted) -->
  <rect x="84" y="200" width="732" height="36" fill="#31363c"/>
  <g font-size="13">
    <text x="118" y="223" fill="#e8e8e8">Cockpit Top</text>
    <text x="236" y="222" fill="#9aa0a8" font-size="12">ismetozalp/ctop</text>
    <text x="400" y="222" fill="#cfd3d8" font-size="12">1.4.0 → 1.5.0</text>
  </g>
  <rect x="536" y="208" width="74" height="20" rx="10" fill="#0d6efd"/>
  <text x="546" y="222" fill="#fff" font-size="11">↑ Update</text>
  <rect x="750" y="206" width="54" height="24" rx="4" fill="#0d6efd"/>
  <text x="759" y="222" fill="#fff" font-size="10">Update</text>

  <!-- row 3: IF TV — not installed, selected for install -->
  <rect x="84" y="236" width="732" height="36" fill="#2b3138"/>
  <rect x="90" y="246" width="16" height="16" rx="3" fill="#0d6efd" stroke="#0d6efd"/>
  <text x="93" y="258" fill="#fff" font-size="12">✓</text>
  <g font-size="13">
    <text x="118" y="259" fill="#e8e8e8">IF TV</text>
    <text x="236" y="258" fill="#9aa0a8" font-size="12">ismetozalp/iftv</text>
    <text x="400" y="258" fill="#6a6f76" font-size="12">—</text>
  </g>
  <rect x="536" y="244" width="132" height="20" rx="10" fill="#6c757d"/>
  <text x="546" y="258" fill="#fff" font-size="11">— Not installed</text>
  <rect x="750" y="242" width="58" height="24" rx="4" fill="#20242a" stroke="#0d6efd"/>
  <text x="759" y="258" fill="#4dabf7" font-size="10">Install</text>

  <!-- row 4: Manifest — up to date -->
  <g font-size="13">
    <text x="118" y="295" fill="#e8e8e8">Manifest</text>
    <text x="236" y="294" fill="#9aa0a8" font-size="12">ismetozalp/manifest</text>
    <text x="400" y="294" fill="#cfd3d8" font-size="12">1.2.0</text>
  </g>
  <rect x="536" y="280" width="104" height="20" rx="10" fill="#198754"/>
  <text x="546" y="294" fill="#fff" font-size="11">✓ Up to date</text>

  <!-- row 5: Hangar — up to date (highlighted) -->
  <rect x="84" y="308" width="732" height="36" fill="#2b3138"/>
  <g font-size="13">
    <text x="118" y="331" fill="#e8e8e8">Hangar</text>
    <text x="236" y="330" fill="#9aa0a8" font-size="12">ismetozalp/hangar</text>
    <text x="400" y="330" fill="#cfd3d8" font-size="12">1.0.0</text>
  </g>
  <rect x="536" y="316" width="104" height="20" rx="10" fill="#198754"/>
  <text x="546" y="330" fill="#fff" font-size="11">✓ Up to date</text>

  <!-- row 6: Pilot — update available -->
  <g font-size="13">
    <text x="118" y="367" fill="#e8e8e8">Pilot</text>
    <text x="236" y="366" fill="#9aa0a8" font-size="12">ismetozalp/pilot</text>
    <text x="400" y="366" fill="#cfd3d8" font-size="12">1.0.0 → 1.0.1</text>
  </g>
  <rect x="536" y="352" width="74" height="20" rx="10" fill="#0d6efd"/>
  <text x="546" y="366" fill="#fff" font-size="11">↑ Update</text>
  <rect x="750" y="350" width="54" height="24" rx="4" fill="#0d6efd"/>
  <text x="759" y="366" fill="#fff" font-size="10">Update</text>

  <line x1="84" y1="380" x2="816" y2="380" stroke="#3d4147"/>

  <!-- log pane -->
  <text x="84" y="400" fill="#8b93a0" font-size="12">Log</text>
  <rect x="84" y="408" width="732" height="106" rx="6" fill="#1b1d21" stroke="#3d4147"/>
  <g font-family="Menlo,Consolas,monospace" font-size="11">
    <text x="96" y="426" fill="#9aa0a8">Checking ismetozalp/explorer... up to date (2.4.1)</text>
    <text x="96" y="442" fill="#9aa0a8">Checking ismetozalp/ctop... update available (1.4.0 → 1.5.0)</text>
    <text x="96" y="458" fill="#9aa0a8">Checking ismetozalp/iftv... not installed</text>
    <text x="96" y="474" fill="#9aa0a8">Checking ismetozalp/manifest... up to date (1.2.0)</text>
    <text x="96" y="490" fill="#9aa0a8">Checking ismetozalp/hangar... up to date (1.0.0)</text>
    <text x="96" y="506" fill="#7fd18a">Checking ismetozalp/pilot... update available (1.0.0 → 1.0.1)</text>
  </g>

  <!-- footer buttons -->
  <rect x="340" y="518" width="150" height="30" rx="6" fill="#0d6efd"/>
  <text x="352" y="538" fill="#fff" font-size="12">Install selected (1)</text>

  <rect x="500" y="518" width="100" height="30" rx="6" fill="#31363c" stroke="#4a4e53"/>
  <text x="515" y="538" fill="#cfd3d8" font-size="12">Update all</text>

  <rect x="610" y="518" width="136" height="30" rx="6" fill="#3a2a2a" stroke="#7a4a4a"/>
  <text x="622" y="538" fill="#f2a5a5" font-size="12">Restart Cockpit</text>

  <rect x="756" y="518" width="60" height="30" rx="6" fill="#31363c" stroke="#4a4e53"/>
  <text x="770" y="538" fill="#cfd3d8" font-size="12">Close</text>
</svg>
