<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="520" fill="#1b1d21"/>

  <!-- faint toolbar strip behind the modal -->
  <g opacity="0.4" font-size="12">
    <rect x="0" y="0" width="900" height="22" fill="#23262b"/>
    <text x="16" y="15" fill="#8b93a0">Explorer</text>
    <text x="760" y="15" fill="#8b93a0">⬆ Plugins</text>
    <text x="830" y="15" fill="#8b93a0">⛁ Mounts</text>
  </g>

  <!-- modal panel -->
  <rect x="60" y="30" width="780" height="460" rx="10" fill="#292d31" stroke="#4a4e53"/>

  <!-- title bar -->
  <text x="84" y="62" fill="#f0f0f0" font-size="20" font-weight="bold">Plugin Manager</text>
  <text x="800" y="62" fill="#9aa0a8" font-size="20">×</text>
  <line x1="60" y1="78" x2="840" y2="78" stroke="#3d4147"/>

  <!-- toolbar row: check for updates + force reinstall -->
  <rect x="84" y="90" width="170" height="32" rx="6" fill="#31363c" stroke="#4a4e53"/>
  <text x="100" y="111" fill="#e8e8e8" font-size="13">Check for updates</text>
  <rect x="280" y="98" width="16" height="16" rx="3" fill="#1b1d21" stroke="#6a6f76"/>
  <text x="306" y="111" fill="#cfd3d8" font-size="13">Force reinstall</text>

  <line x1="60" y1="134" x2="840" y2="134" stroke="#3d4147"/>

  <!-- table header -->
  <g font-size="12" fill="#8b93a0">
    <text x="118" y="154">Plugin</text>
    <text x="236" y="154">Repo</text>
    <text x="474" y="154">Installed</text>
    <text x="572" y="154">Latest</text>
    <text x="670" y="154">Status</text>
  </g>

  <!-- row 1: Explorer — up to date -->
  <g font-size="13">
    <text x="118" y="187" fill="#e8e8e8">Explorer</text>
    <text x="236" y="186" fill="#9aa0a8" font-size="12">ismetozalp/explorer</text>
    <text x="474" y="186" fill="#cfd3d8" font-size="12">2.3.0</text>
    <text x="572" y="186" fill="#cfd3d8" font-size="12">2.3.0</text>
    <text x="670" y="186" fill="#7fd18a" font-size="12">✓ Up to date</text>
  </g>

  <!-- row 2: Cockpit Top — update available (highlighted) -->
  <rect x="84" y="200" width="732" height="36" fill="#31363c"/>
  <g font-size="13">
    <text x="118" y="223" fill="#e8e8e8">Cockpit Top</text>
    <text x="236" y="222" fill="#9aa0a8" font-size="12">ismetozalp/ctop</text>
    <text x="474" y="222" fill="#cfd3d8" font-size="12">1.4.0</text>
    <text x="572" y="222" fill="#f0c674" font-size="12">1.5.0</text>
    <text x="670" y="222" fill="#4dabf7" font-size="12">↑ Update</text>
  </g>
  <rect x="750" y="206" width="54" height="24" rx="4" fill="#0d6efd"/>
  <text x="759" y="222" fill="#fff" font-size="10">Update</text>

  <!-- row 3: IF TV — not installed, selected for install -->
  <rect x="84" y="236" width="732" height="36" fill="#2b3138"/>
  <rect x="90" y="246" width="16" height="16" rx="3" fill="#0d6efd" stroke="#0d6efd"/>
  <text x="93" y="258" fill="#fff" font-size="12">✓</text>
  <g font-size="13">
    <text x="118" y="259" fill="#e8e8e8">IF TV</text>
    <text x="236" y="258" fill="#9aa0a8" font-size="12">ismetozalp/iftv</text>
    <text x="474" y="258" fill="#6a6f76" font-size="12">—</text>
    <text x="572" y="258" fill="#cfd3d8" font-size="12">0.9.0</text>
    <text x="670" y="258" fill="#9aa0a8" font-size="12">Not installed</text>
  </g>

  <!-- row 4: Manifest — up to date -->
  <g font-size="13">
    <text x="118" y="295" fill="#e8e8e8">Manifest</text>
    <text x="236" y="294" fill="#9aa0a8" font-size="12">ismetozalp/manifest</text>
    <text x="474" y="294" fill="#cfd3d8" font-size="12">1.2.0</text>
    <text x="572" y="294" fill="#cfd3d8" font-size="12">1.2.0</text>
    <text x="670" y="294" fill="#7fd18a" font-size="12">✓ Up to date</text>
  </g>

  <line x1="84" y1="308" x2="816" y2="308" stroke="#3d4147"/>

  <!-- log pane -->
  <text x="84" y="328" fill="#8b93a0" font-size="12">Log</text>
  <rect x="84" y="336" width="732" height="90" rx="6" fill="#1b1d21" stroke="#3d4147"/>
  <g font-family="Menlo,Consolas,monospace" font-size="11">
    <text x="96" y="354" fill="#9aa0a8">Checking ismetozalp/explorer... up to date (2.3.0)</text>
    <text x="96" y="370" fill="#9aa0a8">Checking ismetozalp/ctop... update available (1.4.0 → 1.5.0)</text>
    <text x="96" y="386" fill="#9aa0a8">Checking ismetozalp/iftv... not installed</text>
    <text x="96" y="402" fill="#7fd18a">Checking ismetozalp/manifest... up to date (1.2.0)</text>
  </g>

  <!-- footer buttons -->
  <rect x="340" y="446" width="150" height="30" rx="6" fill="#0d6efd"/>
  <text x="352" y="466" fill="#fff" font-size="12">Install selected (1)</text>

  <rect x="500" y="446" width="100" height="30" rx="6" fill="#31363c" stroke="#4a4e53"/>
  <text x="515" y="466" fill="#cfd3d8" font-size="12">Update all</text>

  <rect x="610" y="446" width="136" height="30" rx="6" fill="#3a2a2a" stroke="#7a4a4a"/>
  <text x="622" y="466" fill="#f2a5a5" font-size="12">Restart Cockpit</text>

  <rect x="756" y="446" width="60" height="30" rx="6" fill="#31363c" stroke="#4a4e53"/>
  <text x="770" y="466" fill="#cfd3d8" font-size="12">Close</text>
</svg>
