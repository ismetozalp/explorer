<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explorer</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/prism.css">
    <link rel="stylesheet" href="css/quill.snow.css">
    <link rel="stylesheet" href="css/diff2html.min.css">
    <link rel="stylesheet" href="css/xterm.css">
    <link rel="stylesheet" href="css/explorer.css">
    <script src="../base1/cockpit.js"></script>
</head>
<body x-data="explorer" @keydown.window="onKey($event)" @click.window="closeContextMenu()">

<!-- ============== TAB BAR ============== -->
<div class="tab-bar">
    <div class="tab-list" x-sort="moveTab($item, $position)">
    <template x-for="(tab, idx) in tabs" :key="tab.id">
        <div class="tab"
             :class="{ active: tab.id === activeTabId }"
             @click="activateTab(tab.id)"
             @contextmenu.prevent="openTabMenu($event, tab.id)"
             @auxclick="$event.button === 1 && closeTab(tab.id)"
             x-sort:item="tab.id">
            <span class="tab-label" x-text="tabLabel(tab)"></span>
            <span class="tab-admin-badge" x-show="tab.kind === 'dir' && tab.listAdminPath === tab.path" title="Listing as administrator">root</span>
            <span class="tab-git-badge" x-show="tab.gitInfo && tab.gitInfo.branch" :title="'git: ' + tab.gitInfo?.branch + (tab.gitInfo?.dirty ? ' (dirty)' : '')">⎇</span>
            <button class="tab-close" @click.stop="closeTab(tab.id)" title="Close">×</button>
        </div>
    </template>
    </div>
    <button class="tab-new" @click="newTab()" title="New folder tab (Ctrl+T)">+</button>
    <button class="tab-new tab-new-term" @click="newTerminalTab()" title="New terminal tab">+▤</button>
    <div class="tab-bar-spacer"></div>
    <span class="explorer-version-badge" x-show="pluginVersion"
          :class="{ 'update-available': updateState.available }"
          style="cursor:pointer"
          @click="updateState.available ? startSelfUpdate() : checkForUpdate(true)"
          :title="updateState.checking ? 'Checking for updates…' : (updateState.available ? ('Update to v' + updateState.available.version + ' available — click to install') : 'Click to check for updates')"
          x-text="(updateState.available ? '↑ ' : '') + 'Explorer v' + pluginVersion"></span>
    <button class="btn btn-sm btn-link tab-bar-btn" @click="openGlobalActions()" title="Run a global action (not tied to a file)">
        <span>▶ Run</span>
    </button>
    <!-- tmux session manager (only when tmux is installed) -->
    <div class="tmux-wrap" x-show="tmux.available" @click.outside="tmux.open = false">
        <button class="btn btn-sm btn-link tab-bar-btn" @click="toggleTmuxPanel($event)" :class="{ 'tmux-btn-active': tmux.open }" title="tmux sessions">
            <span>▤ tmux</span>
        </button>
        <div class="tmux-panel" x-show="tmux.open" x-cloak :style="`top:${tmux.top}px;right:${tmux.right}px`">
            <div class="tmux-panel-head">
                <span>tmux sessions</span>
                <button class="tmux-icon-btn" @click="refreshTmuxSessions()" title="Refresh">⟳</button>
            </div>
            <div class="tmux-panel-body">
                <div class="tmux-empty" x-show="tmux.loading">Loading…</div>
                <div class="tmux-empty text-danger" x-show="!tmux.loading && tmux.error" x-text="tmux.error"></div>
                <div class="tmux-empty" x-show="!tmux.loading && !tmux.error && !tmux.sessions.length">No sessions yet.</div>
                <template x-for="s in tmux.sessions" :key="s.name">
                    <div class="tmux-row" :class="{ open: isTmuxSessionOpen(s.name) }">
                        <button class="tmux-row-main" @click="openTmuxSession(s.name)" :title="'Open ' + s.name">
                            <span class="tmux-row-name" x-text="s.name"></span>
                            <span class="tmux-row-meta" x-text="s.windows + (s.windows === 1 ? ' window' : ' windows') + (s.attached ? ' · attached' : '')"></span>
                            <span class="tmux-row-open" x-show="isTmuxSessionOpen(s.name)">open</span>
                        </button>
                        <button class="tmux-kill" @click.stop="killTmuxSession(s.name)" title="Kill session">✕</button>
                    </div>
                </template>
            </div>
            <div class="tmux-panel-foot">
                <button class="tmux-new" @click="newTmuxSession()">＋ New session…</button>
                <button class="tmux-new tmux-conf" x-show="tmux.hasConf" x-cloak @click="editTmuxConf()" title="Edit ~/.tmux.conf">⚙ Edit .tmux.conf</button>
            </div>
        </div>
    </div>
    <button class="btn btn-sm btn-link tab-bar-btn" @click="openMounts()" title="Mounts / fstab editor">
        <span>⛁ Mounts</span>
    </button>
    <button class="btn btn-sm btn-link tab-bar-btn" @click="openGrub()" x-show="grub.available" x-cloak title="Edit /etc/default/grub and regenerate the boot config">
        <span>⏻ GRUB</span>
    </button>
    <button class="btn btn-sm btn-link tab-bar-btn" @click="openActionsManager()" title="Manage custom actions">
        <span>⚙ Actions</span>
    </button>
    <button class="btn btn-sm btn-link tab-bar-btn" @click="openPluginUpdater()" title="Plugin Manager — update or install your Cockpit plugins">
        <span>⬆ Plugins</span>
    </button>
    <button class="btn btn-sm btn-link tab-bar-btn" @click="openSettings()" title="Settings">
        <span>⚙</span>
    </button>
</div>

<!-- ============== TABS CONTENT ============== -->
<template x-for="tab in tabs" :key="tab.id">
    <div class="tab-pane" x-show="tab.id === activeTabId">
      <!-- ===== DIRECTORY TAB ===== -->
      <template x-if="tab.kind === 'dir'">
       <div class="tab-pane-inner d-flex flex-column flex-grow-1" style="min-height:0">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="btn-group btn-group-sm me-2 toolbar-nav">
                <button class="btn btn-outline-secondary" @click="goBack(activePane(tab))" :disabled="activePane(tab).historyIdx <= 0" title="Back (Alt+Left)">←</button>
                <button class="btn btn-outline-secondary" @click="goForward(activePane(tab))" :disabled="activePane(tab).historyIdx >= activePane(tab).history.length - 1" title="Forward (Alt+Right)">→</button>
                <button class="btn btn-outline-secondary" @click="goUp(activePane(tab))" title="Up">↑</button>
                <button class="btn btn-outline-secondary" @click="goHome(activePane(tab))" title="Home">⌂</button>
                <button class="btn btn-outline-secondary" @click="reload(activePane(tab))" title="Reload (F5)">⟳</button>
            </div>

            <!-- Dual-pane toggle (Midnight Commander style) -->
            <button class="btn btn-sm me-2" :class="tab.dual ? 'btn-primary' : 'btn-outline-secondary'"
                    @click="toggleDualPane(tab)" :title="tab.dual ? 'Switch to single pane' : 'Split into two panes'">⊞ <span x-text="tab.dual ? 'Single' : 'Split'"></span></button>

            <!-- Breadcrumbs / path input (active pane) -->
            <!-- Uses tab.editingPathTop (not the pane's editingPath) so that in
                 dual mode the top bar and the active pane's per-pane bar never
                 render two focus-stealing inputs for the same flag. -->
            <div class="path-bar flex-grow-1" @dblclick="tab.editingPathTop = true">
                <template x-if="!tab.editingPathTop">
                    <div class="breadcrumbs" @click="tab.editingPathTop = true">
                        <a href="#" class="breadcrumb-root" @click.prevent.stop="navigate(activePane(tab), '/')">/</a><template x-for="(seg, i) in pathSegments(activePane(tab).path)" :key="i"><span><a href="#" @click.prevent.stop="navigate(activePane(tab), seg.path)" x-text="seg.label"></a><span x-show="i < pathSegments(activePane(tab).path).length - 1" class="sep">/</span></span></template>
                    </div>
                </template>
                <template x-if="tab.editingPathTop">
                    <input type="text" class="form-control form-control-sm path-input"
                           :value="activePane(tab).path"
                           @keydown.enter="navigate(activePane(tab), $event.target.value); tab.editingPathTop = false"
                           @keydown.escape="tab.editingPathTop = false"
                           @blur="tab.editingPathTop = false"
                           x-init="$nextTick(() => $el.focus())">
                </template>
            </div>

            <!-- Search (active pane) -->
            <div class="search-box ms-2">
                <input type="text" class="form-control form-control-sm" placeholder="Search…"
                       x-model="activePane(tab).search.query"
                       @keydown.enter="runSearch(activePane(tab))"
                       @keydown.escape="clearSearch(activePane(tab))">
                <div class="search-opts dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">⚙</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><label class="dropdown-item"><input type="radio" :name="'srch-mode-' + tab.id" value="name" x-model="activePane(tab).search.mode"> Filename match</label></li>
                        <li><label class="dropdown-item"><input type="radio" :name="'srch-mode-' + tab.id" value="content" x-model="activePane(tab).search.mode"> Content (grep)</label></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><label class="dropdown-item"><input type="checkbox" x-model="activePane(tab).search.recursive"> Search subfolders</label></li>
                        <li><label class="dropdown-item"><input type="checkbox" x-model="activePane(tab).search.regex"> Regular expression</label></li>
                        <li><label class="dropdown-item"><input type="checkbox" x-model="activePane(tab).search.caseInsensitive"> Case-insensitive</label></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button class="dropdown-item" @click="runSearch(activePane(tab))">Search</button></li>
                        <li><button class="dropdown-item" @click="clearSearch(activePane(tab))" x-show="activePane(tab).search.active">Clear results</button></li>
                    </ul>
                </div>
            </div>

            <!-- View options -->
            <div class="ms-2 dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">View</button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><label class="dropdown-item"><input type="checkbox" x-model="settings.showHidden" @change="saveSettings(); reload(tab)"> Hidden files</label></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><h6 class="dropdown-header">Columns</h6></li>
                    <li><label class="dropdown-item"><input type="checkbox" x-model="settings.columns.size" @change="saveSettings()"> Size</label></li>
                    <li><label class="dropdown-item"><input type="checkbox" x-model="settings.columns.modified" @change="saveSettings()"> Modified</label></li>
                    <li><label class="dropdown-item"><input type="checkbox" x-model="settings.columns.perms" @change="saveSettings()"> Permissions</label></li>
                    <li><label class="dropdown-item"><input type="checkbox" x-model="settings.columns.owner" @change="saveSettings()"> Owner / Group</label></li>
                    <li><label class="dropdown-item"><input type="checkbox" x-model="settings.columns.type" @change="saveSettings()"> Type</label></li>
                </ul>
            </div>

            <!-- Run command -->
            <button class="btn btn-sm btn-outline-secondary ms-1" @click="openRunCommand(activePane(tab))" title="Run command (in shell)">⌨ Run…</button>

            <!-- Integrated split terminal (v1.2) -->
            <button class="btn btn-sm btn-outline-secondary ms-1" @click="openIntegratedTerminal(tab, activePane(tab).path)" title="Open integrated terminal at this directory">▤ Term</button>

            <!-- Open in Cockpit terminal -->
            <button class="btn btn-sm btn-outline-secondary ms-1" @click="openInTerminal(activePane(tab).path)" title="Open Cockpit terminal page at this directory">▭ Cockpit term</button>

            <!-- Cached repos dropdown (v1.2) -->
            <div class="dropdown ms-1" x-show="cachedRepoList().length > 0">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" :title="cachedRepoList().length + ' cached repositories'">
                    <span style="font-weight:bold">⌂</span> Repos
                </button>
                <ul class="dropdown-menu dropdown-menu-end cached-repos-dropdown">
                    <li><h6 class="dropdown-header">Cached local repositories</h6></li>
                    <template x-for="r in cachedRepoList()" :key="r.key + '|' + r.path">
                        <li class="cached-repo-row">
                            <a class="dropdown-item" href="#" @click.prevent="navigateToCachedRepo(activePane(tab), r.path)" :title="r.path">
                                <span class="repo-title" x-text="r.title"></span>
                                <span class="repo-key ms-2" x-text="r.key"></span>
                                <span class="repo-path" x-text="r.path"></span>
                            </a>
                            <button class="cached-repo-btn" @click.stop.prevent="setRepoTitle(r.key, r.path)" title="Rename">✎</button>
                            <button class="cached-repo-btn cached-repo-forget" @click.stop.prevent="forgetCheckout(r.key, r.path)" title="Unregister (remove from cache; files are NOT deleted)">✕</button>
                        </li>
                    </template>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item small text-muted" href="#" @click.prevent="openGithubPanel(tab)">Manage cache in GitHub panel…</a></li>
                </ul>
            </div>

            <!-- GitHub menu -->
            <button class="btn btn-sm btn-outline-secondary ms-1" @click="openGithubPanel(tab)" title="GitHub"><span style="font-weight:bold">GH</span></button>
        </div>

        <!-- Current-repo strip (active pane's git work-tree) -->
        <div class="repo-strip" x-show="activePane(tab).gitInfo && activePane(tab).gitInfo.branch">
            <span class="repo-strip-branch">
                <span class="dropdown d-inline-block">
                    <a class="branch-dd-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="true" @click.prevent="loadRepoBranches(activePane(tab))" title="Switch branch">
                        <strong x-text="activePane(tab).gitInfo?.branch"></strong> <span class="branch-dd-caret">▾</span>
                    </a>
                    <ul class="dropdown-menu branch-dd-menu">
                        <li><h6 class="dropdown-header">Switch branch</h6></li>
                        <li x-show="branchSwitcher.loading"><span class="dropdown-item-text text-muted small">Loading…</span></li>
                        <template x-for="b in branchSwitcher.locals" :key="b">
                            <li><a class="dropdown-item" :class="{ active: b === branchSwitcher.current }" href="#" @click.prevent="switchRepoBranch(activePane(tab), b, false)" x-text="b"></a></li>
                        </template>
                        <template x-if="!branchSwitcher.loading && branchSwitcher.remotes.length">
                            <li><h6 class="dropdown-header">Remote branches</h6></li>
                        </template>
                        <template x-for="b in branchSwitcher.remotes" :key="'r:' + b">
                            <li><a class="dropdown-item small" href="#" @click.prevent="switchRepoBranch(activePane(tab), b, true)"><span x-text="b"></span></a></li>
                        </template>
                        <li x-show="!branchSwitcher.loading && !branchSwitcher.locals.length && !branchSwitcher.remotes.length"><span class="dropdown-item-text text-muted small">No branches.</span></li>
                        <template x-if="branchSwitcher.copies.length">
                            <li><hr class="dropdown-divider"></li>
                        </template>
                        <template x-if="branchSwitcher.copies.length">
                            <li><h6 class="dropdown-header">Local copies of this repo</h6></li>
                        </template>
                        <template x-for="c in branchSwitcher.copies" :key="'c:' + c.path">
                            <li>
                                <a class="dropdown-item branch-copy-item" :class="{ active: c.current }" href="#" @click.prevent="navigateToCachedRepo(activePane(tab), c.path)" :title="c.path">
                                    <span class="branch-copy-title" x-text="c.title"></span>
                                    <span class="branch-copy-path" x-text="c.path"></span>
                                </a>
                            </li>
                        </template>
                    </ul>
                </span>
                <span x-show="activePane(tab).gitInfo?.dirty" class="badge bg-warning text-dark ms-1" :title="'Uncommitted changes: ' + (activePane(tab).gitInfo?.dirtyCount || 0)">●</span>
                <span x-show="activePane(tab).gitInfo?.ahead > 0" class="badge bg-info text-dark ms-1" :title="'Ahead of ' + activePane(tab).gitInfo?.remoteBranch + ' by ' + activePane(tab).gitInfo?.ahead + ' commit(s)'">↑<span x-text="activePane(tab).gitInfo?.ahead"></span></span>
                <span x-show="activePane(tab).gitInfo?.behind > 0" class="badge bg-info text-dark ms-1" :title="'Behind ' + activePane(tab).gitInfo?.remoteBranch + ' by ' + activePane(tab).gitInfo?.behind + ' commit(s)'">↓<span x-text="activePane(tab).gitInfo?.behind"></span></span>
                <span class="text-muted ms-2 small" x-text="activePane(tab).gitInfo?.remote?.ownerRepo"></span>
                <button class="btn btn-sm btn-link p-0 ms-2"
                        x-show="activePane(tab).gitInfo?.remote?.ownerRepo && !isCheckoutCached(activePane(tab).gitInfo.remote.ownerRepo, activePane(tab).path)"
                        @click="registerCurrentTab(activePane(tab))" title="Register this checkout in the repo cache">+ Register</button>
                <span class="badge bg-success ms-2 small"
                      x-show="activePane(tab).gitInfo?.remote?.ownerRepo && isCheckoutCached(activePane(tab).gitInfo.remote.ownerRepo, activePane(tab).path)">cached</span>
            </span>
            <span class="ms-auto btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" x-show="gh.state === 'authed'" @click="repoFetch(activePane(tab))" title="Fetch (git fetch --all --prune)">Fetch</button>
                <button class="btn btn-outline-secondary" x-show="gh.state === 'authed'" @click="repoPull(activePane(tab))" title="Pull (fast-forward only)">Pull</button>
                <button class="btn btn-outline-secondary" @click="repoStageCommit(activePane(tab), false)" :disabled="!activePane(tab).gitInfo?.dirty" title="Commit staged changes locally (no network)">Commit…</button>
                <button class="btn btn-outline-secondary" x-show="gh.state === 'authed'" @click="repoStageCommit(activePane(tab), true)" :disabled="!activePane(tab).gitInfo?.dirty">Commit &amp; Push…</button>
                <button class="btn btn-outline-primary" x-show="gh.state === 'authed'" @click="repoPush(activePane(tab))">Push</button>
                <button class="btn btn-outline-danger" x-show="activePane(tab).gitInfo?.dirty" @click="repoRollback(activePane(tab))" title="Discard ALL uncommitted changes (reset --hard + remove untracked files)">Rollback</button>
                <button class="btn btn-outline-warning" x-show="gh.state !== 'authed'" @click="openGithubPanel(tab)" title="Set up GitHub (gh CLI) to enable Fetch / Pull / Push">Set up GitHub…</button>
            </span>
        </div>

        <!-- Not-a-repo strip: offer to publish to GitHub -->
        <div class="publish-strip" x-show="activePane(tab).gitChecked && !activePane(tab).gitInfo && !insideAnyRepoCache(activePane(tab).path)">
            <span class="text-muted">This folder isn't version-controlled.</span>
            <button class="btn btn-sm btn-outline-primary ms-auto" @click="openPublishDialog(activePane(tab))">Publish to GitHub…</button>
        </div>

        <!-- File panes (1 or 2, MC-style) + optional integrated terminal split -->
        <div class="tab-split-body" :class="{ 'dual-horizontal': tab.dual }">
        <div class="panes-container">
        <template x-for="p in paneList(tab)" :key="p.paneId || p.id">
          <div class="file-pane" :class="{ 'pane-active': tab.dual && isActivePane(tab, p), dual: tab.dual }"
               @mousedown="_activatePaneRef(tab, p)">
            <!-- per-pane path header (dual mode only) -->
            <div class="pane-head" x-show="tab.dual">
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary" @click="goUp(p)" title="Up">↑</button>
                    <button class="btn btn-outline-secondary" @click="reload(p)" title="Reload">⟳</button>
                </div>
                <div class="pane-path breadcrumbs ms-2 flex-grow-1" @dblclick="p.editingPath = true">
                    <template x-if="!p.editingPath">
                        <span><a href="#" class="breadcrumb-root" @click.prevent.stop="navigate(p, '/')">/</a><template x-for="(seg, i) in pathSegments(p.path)" :key="i"><span><a href="#" @click.prevent.stop="navigate(p, seg.path)" x-text="seg.label"></a><span x-show="i < pathSegments(p.path).length - 1" class="sep">/</span></span></template></span>
                    </template>
                    <template x-if="p.editingPath">
                        <input type="text" class="form-control form-control-sm path-input"
                               :value="p.path"
                               @keydown.enter="navigate(p, $event.target.value); p.editingPath = false"
                               @keydown.escape="p.editingPath = false"
                               @blur="p.editingPath = false"
                               x-init="$nextTick(() => $el.focus())">
                    </template>
                </div>
            </div>

            <!-- per-pane error -->
            <div x-show="p.error" class="alert alert-warning alert-sm mb-0" role="alert">
                <span x-text="p.error"></span>
                <button x-show="p.errorRetryAsAdmin" class="btn btn-sm btn-warning ms-2" @click="reload(p, { admin: true })">Retry as administrator</button>
                <button class="btn-close float-end" @click="p.error = null"></button>
            </div>

            <!-- per-pane search results header -->
            <div x-show="p.search.active" class="search-results-bar">
                <span>Search results for <strong x-text="p.search.query"></strong>
                      (<span x-text="p.search.mode === 'content' ? 'content' : 'filename'"></span><span
                       x-show="p.search.regex">, regex</span><span
                       x-show="p.search.caseInsensitive">, case-insensitive</span>,
                      <span x-text="p.files.length"></span> results)</span>
                <button class="btn btn-sm btn-link" @click="clearSearch(p)">Clear</button>
            </div>

            <div class="file-list-wrap"
                 @click.self="clearSelection(p)"
                 @contextmenu.self.prevent="openContextMenu($event, p, null)"
                 @dragover.prevent="onDragOver($event, p)"
                 @drop.prevent="onDrop($event, p)">
                <table class="file-list table table-sm table-hover">
                    <thead>
                        <tr>
                            <th class="col-check"><input type="checkbox" @change="toggleSelectAll(p, $event.target.checked)"></th>
                            <th class="col-name sortable" @click="setSort(p, 'name')">Name <span x-text="sortIndicator(p, 'name')"></span></th>
                            <th class="col-size sortable" x-show="settings.columns.size" @click="setSort(p, 'size')">Size <span x-text="sortIndicator(p, 'size')"></span></th>
                            <th class="col-modified sortable" x-show="settings.columns.modified" @click="setSort(p, 'mtime')">Modified <span x-text="sortIndicator(p, 'mtime')"></span></th>
                            <th class="col-perms" x-show="settings.columns.perms">Permissions</th>
                            <th class="col-owner" x-show="settings.columns.owner">Owner</th>
                            <th class="col-type" x-show="settings.columns.type">Type</th>
                            <th class="col-menu" aria-label="Actions"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="file in sortedFiles(p)" :key="file.path">
                            <tr :class="{ selected: p.selection.includes(file.path), 'cut-file': clipboard.op === 'cut' && clipboard.paths.includes(file.path) }"
                                :data-path="file.path"
                                @click="onRowClick($event, p, file)"
                                @dblclick="openFile(p, file)"
                                @contextmenu.prevent="onRowContextMenu($event, p, file)"
                                draggable="true"
                                @dragstart="onDragStart($event, p, file)"
                                @dragover="onRowDragOver($event, file)"
                                @dragleave="onRowDragLeave($event)"
                                @drop.prevent.stop="onDrop($event, p, file)">
                                <td class="col-check" @click.stop><input type="checkbox" :checked="p.selection.includes(file.path)" @change="toggleSelect(p, file)"></td>
                                <td class="col-name">
                                    <span class="file-icon" x-text="fileIcon(file)"></span>
                                    <span class="file-name" x-text="file.name"></span>
                                    <span x-show="file.symlinkTarget" class="symlink-target" x-text="'→ ' + file.symlinkTarget"></span>
                                </td>
                                <td class="col-size" x-show="settings.columns.size" x-text="file.type === 'd' ? '—' : humanSize(file.size)"></td>
                                <td class="col-modified" x-show="settings.columns.modified" x-text="formatDate(file.mtime)"></td>
                                <td class="col-perms" x-show="settings.columns.perms" x-text="file.perms"></td>
                                <td class="col-owner" x-show="settings.columns.owner" x-text="file.owner + ':' + file.group"></td>
                                <td class="col-type" x-show="settings.columns.type" x-text="typeLabel(file)"></td>
                                <td class="col-menu" @click.stop @dblclick.stop>
                                    <button type="button" class="row-menu-btn" title="Actions"
                                            aria-label="Open actions menu"
                                            @click.stop="onRowContextMenu($event, p, file)" @dblclick.stop>⋮</button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="!p.loading && p.files.length === 0">
                            <td :colspan="visibleColumnCount()" class="empty-state">
                                <span x-show="p.search.active">No results found.</span>
                                <span x-show="!p.search.active">This folder is empty.</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div x-show="p.loading" class="loading-overlay">Loading…</div>
            </div>
          </div>
        </template>
        </div>
        <!-- Integrated terminal split — vertical (right) normally, horizontal (bottom) in dual mode.
             x-if (not x-show): the pane also carries a reactive :style, and toggling Split re-applies
             that :style, which wiped the inline display:none x-show had set — leaving an empty pane
             stuck visible. x-if adds/removes the elements from the DOM, so an empty split can't linger. -->
        <template x-if="tab.splitOpen && tab.terminals && tab.terminals.length > 0">
            <div class="term-resizer" :class="{ horizontal: tab.dual }"
                 @mousedown="_startTermResize($event, tab)"></div>
        </template>
        <template x-if="tab.splitOpen && tab.terminals && tab.terminals.length > 0">
        <div class="term-pane"
             :style="tab.dual ? `height:${tab.splitHeight || 260}px` : `width:${tab.splitWidth || 480}px`">
            <div class="term-stack">
                <div class="term-tabbar">
                    <div class="term-subtab-list" x-sort="moveTerminal(tab, $item, $position)">
                    <template x-for="t in (tab.terminals || [])" :key="t.id">
                        <div class="term-subtab"
                             :class="{ active: tab.activeTermId === t.id }"
                             @click="selectTerminal(tab, t.id)"
                             @auxclick="$event.button === 1 && closeTerminal(tab, t.id)"
                             @mouseenter="showTermPath($event, t)" @mouseleave="hideTermPath()" @dblclick.stop="copyTermDir(t)"
                             x-sort:item="t.id">
                            <span class="term-subtab-label" x-text="termLabel(t)"></span>
                            <button class="term-subtab-close" @click.stop="closeTerminal(tab, t.id)" title="Close terminal (middle-click also)">×</button>
                        </div>
                    </template>
                    </div>
                    <button class="term-subtab-add" @click="addTerminalToTab(tab, activePane(tab).path)" title="New terminal at current folder">+</button>
                    <span class="term-tabbar-spacer"></span>
                    <div class="term-tabbar-actions">
                        <button @click="closeSplit(tab)" title="Close split pane (all terminals)">×</button>
                    </div>
                </div>
                <div class="term-containers">
                    <template x-for="t in (tab.terminals || [])" :key="t.id">
                        <div class="term-container"
                             :id="'term-container-' + t.id"
                             x-show="tab.activeTermId === t.id"></div>
                    </template>
                </div>
            </div>
        </div>
        </template>
        </div>

        <!-- Status bar (active pane) -->
        <div class="status-bar">
            <span x-text="statusText(activePane(tab))"></span>
            <span class="ms-auto" x-text="activePane(tab).selection.length > 0 ? selectionSummary(activePane(tab)) : ''"></span>
        </div>
       </div>
      </template>
      <!-- ===== OUTPUT TAB (custom action streaming) ===== -->
      <template x-if="tab.kind === 'output'">
        <div class="output-pane">
            <div class="output-pane-header">
                <span><strong x-text="tab.outputActionLabel"></strong> — <span x-text="tab.outputChannel ? 'running command' : tab.outputStatus"></span></span>
                <div>
                    <button class="btn btn-sm" :class="tab.follow ? 'btn-success' : 'btn-outline-light'" @click="tab.follow = !tab.follow" :title="tab.follow ? 'Following new output — click to stop' : 'Click to follow output (stay at the bottom)'">
                        <span x-text="(tab.follow ? '⤓ Following' : '⤓ Follow')"></span>
                    </button>
                    <button class="btn btn-sm btn-outline-light ms-1" @click="tab.outputChannel && tab.outputChannel.close('cancelled')" x-show="tab.outputChannel">Stop</button>
                    <button class="btn btn-sm btn-outline-light ms-1" @click="closeTab(tab.id)">Close</button>
                </div>
            </div>
            <div class="output-pane-body"
                 x-init="_initOutputPane($el, tab)"
                 x-effect="tab.outputLines.length; tab.follow; if (tab.follow) _scheduleOutputScroll($el, tab)"
                 x-text="tab.outputLines.join('\n')"></div>
            <div class="output-pane-status">
                <code x-text="tab.outputCommand"></code>
                <span x-text="tab.outputStatus"></span>
            </div>
        </div>
      </template>
      <!-- ===== TERMINAL TAB (full-pane multi-terminal) (v1.2) ===== -->
      <template x-if="tab.kind === 'terminal'">
        <div class="terminal-tab-body">
            <div class="term-stack" :class="'term-stack--' + termKindOf(tab)">
                <div class="term-tabbar">
                    <div class="term-subtab-list" x-sort="moveTerminal(tab, $item, $position)">
                    <template x-for="t in (tab.terminals || [])" :key="t.id">
                        <div class="term-subtab"
                             :class="{ active: tab.activeTermId === t.id }"
                             @click="selectTerminal(tab, t.id)"
                             @auxclick="$event.button === 1 && closeTerminal(tab, t.id)"
                             @mouseenter="showTermPath($event, t)" @mouseleave="hideTermPath()" @dblclick.stop="copyTermDir(t)"
                             x-sort:item="t.id">
                            <span class="term-subtab-label" x-text="termLabel(t)"></span>
                            <button class="term-subtab-close" @click.stop="closeTerminal(tab, t.id)" title="Close terminal">×</button>
                        </div>
                    </template>
                    </div>
                    <button class="term-subtab-add" @click="addPaneToTab(tab)"
                            :title="termKindOf(tab) === 'tmux' ? 'New tmux session' : 'New terminal here'">+</button>
                    <span class="term-tabbar-spacer"></span>
                    <button class="term-paste-img" @click="pasteClipboardImageToTerminal(tab)"
                            title="Paste clipboard image or video → upload to temp folder and send its path">📋</button>
                </div>
                <div class="term-containers">
                    <template x-for="t in (tab.terminals || [])" :key="t.id">
                        <div class="term-container"
                             :id="'term-container-' + t.id"
                             x-show="tab.activeTermId === t.id"></div>
                    </template>
                </div>
            </div>
        </div>
      </template>
    </div>
</template>

<!-- ============== CONTEXT MENUS ============== -->
<div class="context-menu" x-show="ctxMenu.open" :style="`left:${ctxMenu.x}px;top:${ctxMenu.y}px`" @click.stop>
    <template x-if="ctxMenu.kind === 'file' || ctxMenu.kind === 'empty'">
        <ul class="ctx-list" @click="closeContextMenu()">
            <!-- Custom actions, kept at the TOP. Flat when ≤3 total; split into
                 User / System flyout submenus when there are more than 3, so a
                 long list isn't clipped off the bottom of the viewport. -->
            <template x-if="!ctxActionGroups(ctxMenu.target).grouped">
                <template x-for="action in ctxActionGroups(ctxMenu.target).all" :key="action.id">
                    <li @click="(action.requiresGh && gh.state !== 'authed') ? null : runCustomAction(action)"
                        class="ctx-action-item"
                        :class="{ 'ctx-action-disabled': action.requiresGh && gh.state !== 'authed' }"
                        :title="(action.requiresGh && gh.state !== 'authed') ? 'Requires GitHub (gh) — set it up first' : ''">
                        <span class="ctx-action-label" x-text="action.label"></span>
                        <span x-show="action.requiresGh" class="ca-badge ca-badge-system" title="Requires GitHub (gh)">gh</span>
                        <span class="ca-badge" :class="action._source === 'user' ? 'ca-badge-user' : 'ca-badge-system'" x-text="action._source"></span>
                    </li>
                </template>
            </template>
            <template x-if="ctxActionGroups(ctxMenu.target).grouped">
                <template x-for="grp in [
                        { key: 'user',   label: 'User custom actions',   items: ctxActionGroups(ctxMenu.target).user },
                        { key: 'system', label: 'System custom actions', items: ctxActionGroups(ctxMenu.target).system }
                    ]" :key="grp.key">
                    <li class="ctx-submenu" :class="{ 'fly-left': ctxMenu.flyLeft }" x-show="grp.items.length" @click.stop>
                        <span class="ctx-action-label" x-text="grp.label + ' (' + grp.items.length + ')'"></span>
                        <span class="ctx-submenu-arrow" x-text="ctxMenu.flyLeft ? '◂' : '▸'"></span>
                        <ul class="ctx-flyout">
                            <template x-for="action in grp.items" :key="action.id">
                                <li @click="(action.requiresGh && gh.state !== 'authed') ? null : (runCustomAction(action), closeContextMenu())"
                                    class="ctx-action-item"
                                    :class="{ 'ctx-action-disabled': action.requiresGh && gh.state !== 'authed' }"
                                    :title="(action.requiresGh && gh.state !== 'authed') ? 'Requires GitHub (gh) — set it up first' : ''">
                                    <span class="ctx-action-label" x-text="action.label"></span>
                                    <span x-show="action.requiresGh" class="ca-badge ca-badge-system" title="Requires GitHub (gh)">gh</span>
                                    <span class="ca-badge" :class="action._source === 'user' ? 'ca-badge-user' : 'ca-badge-system'" x-text="action._source"></span>
                                </li>
                            </template>
                        </ul>
                    </li>
                </template>
            </template>
            <li class="ctx-sep" x-show="ctxActionGroups(ctxMenu.target).total"></li>
            <li x-show="ctxMenu.kind === 'file'" @click="openSelected()">Open</li>
            <li x-show="ctxMenu.kind === 'file' && isTextLike(ctxMenu.target)" @click="openEditor(ctxMenu.target)">Edit</li>
            <li x-show="ctxMenu.kind === 'file' && isPreviewable(ctxMenu.target)" @click="openPreview(ctxMenu.target)">Preview (Space)</li>
            <li class="ctx-sep" x-show="ctxMenu.kind === 'file'"></li>
            <li x-show="ctxMenu.kind === 'file'" @click="copyToClipboard('copy')">Copy</li>
            <li x-show="ctxMenu.kind === 'file'" @click="copyToClipboard('cut')">Cut</li>
            <li x-show="ctxMenu.kind === 'file'" @click="copyPathToClipboard()" x-text="selectedFiles().length > 1 ? 'Copy paths' : 'Copy path'"></li>
            <li @click="paste()" :class="{ disabled: !clipboard.paths.length }">Paste</li>
            <li class="ctx-sep" x-show="ctxMenu.kind === 'file'"></li>
            <li x-show="ctxMenu.kind === 'file' && currentPane() && currentPane().selection.length === 1" @click="renameSelected()">Rename…</li>
            <li x-show="ctxMenu.kind === 'file'" @click="deleteSelected()">Delete…</li>
            <li class="ctx-sep"></li>
            <li @click="newFolderPrompt()">New folder</li>
            <li @click="newFilePrompt()">New file</li>
            <li class="ctx-sep" x-show="ctxMenu.kind === 'file'"></li>
            <li x-show="ctxMenu.kind === 'file'" @click="downloadSelected()">Download</li>
            <li @click="uploadPrompt()">Upload here…</li>
            <li class="ctx-sep" x-show="ctxMenu.kind === 'file'"></li>
            <li x-show="ctxMenu.kind === 'file'" @click="compressSelected()">Compress…</li>
            <li x-show="ctxMenu.kind === 'file' && isArchive(ctxMenu.target)" @click="extractHere(ctxMenu.target)">Extract here</li>
            <li x-show="ctxMenu.kind === 'file' && isArchive(ctxMenu.target)" @click="extractTo(ctxMenu.target)">Extract to…</li>
            <li class="ctx-sep"></li>
            <li x-show="ctxMenu.kind === 'file' && ctxMenu.target && ctxMenu.target.type === 'd'" @click="openInNewTab(ctxMenu.target)">Open in new tab</li>
            <li @click="openIntegratedTerminal(currentTab(), (ctxMenu.kind === 'file' && ctxMenu.target && ctxMenu.target.type === 'd') ? ctxMenu.target.path : currentPane()?.path)"
                x-text="(ctxMenu.kind === 'file' && ctxMenu.target && ctxMenu.target.type === 'd') ? 'Open terminal in folder (split)' : 'Open terminal here (split)'"></li>
            <li @click="newTerminalTab((ctxMenu.kind === 'file' && ctxMenu.target && ctxMenu.target.type === 'd') ? ctxMenu.target.path : currentPane()?.path)"
                x-text="(ctxMenu.kind === 'file' && ctxMenu.target && ctxMenu.target.type === 'd') ? 'Open folder in new terminal tab' : 'Open in new terminal tab'"></li>
            <li @click="openInTerminal((ctxMenu.kind === 'file' && ctxMenu.target && ctxMenu.target.type === 'd') ? ctxMenu.target.path : currentPane()?.path)">Open in Cockpit terminal</li>
            <li x-show="ctxMenu.kind === 'file' && selectedFiles().length === 1" @click="propertiesSelected()">Permissions…</li>
            <li class="ctx-sep"></li>
            <li @click="reloadActions()" title="Re-read custom actions from disk (after editing actions.json)">↻ Reload actions</li>
        </ul>
    </template>
    <template x-if="ctxMenu.kind === 'tab'">
        <ul class="ctx-list" @click="closeContextMenu()">
            <li @click="duplicateTab(ctxMenu.tabId)">Duplicate tab</li>
            <li class="ctx-sep"></li>
            <li @click="closeTab(ctxMenu.tabId)">Close</li>
            <li @click="closeOtherTabs(ctxMenu.tabId)">Close others</li>
            <li @click="closeTabsLeft(ctxMenu.tabId)">Close to the left</li>
            <li @click="closeTabsRight(ctxMenu.tabId)">Close to the right</li>
        </ul>
    </template>
</div>

<!-- ============== TERMINAL PATH POPOVER ============== -->
<div class="term-path-pop" x-show="termPathPop.open"
     :style="`top:${termPathPop.top}px;left:${termPathPop.left}px`"
     @mouseenter="keepTermPath()" @mouseleave="hideTermPath()" x-cloak>
    <code class="term-path-pop-text" x-text="termPathPop.path"></code>
    <button class="btn btn-sm btn-outline-light term-path-pop-copy" @click="copyTermPath()">Copy path</button>
</div>

<!-- ============== OPERATIONS TRAY ============== -->
<div class="ops-tray" x-show="operations.length > 0">
    <div class="ops-header">
        <span>Operations (<span x-text="operations.filter(o => o.status === 'running').length"></span> running)</span>
        <button class="btn-close" @click="clearFinishedOperations()" title="Clear finished"></button>
    </div>
    <div class="ops-body">
        <template x-for="op in operations" :key="op.id">
            <div class="op-row" :class="'op-' + op.status">
                <span class="op-label" x-text="op.label"></span>
                <div class="progress" x-show="op.status === 'running'">
                    <div class="progress-bar"
                         :class="op.indeterminate ? 'progress-bar-striped progress-bar-animated' : ''"
                         :style="op.indeterminate ? 'width:100%' : ('width:' + (op.progress || 0) + '%')"
                         x-text="op.indeterminate ? '' : ((op.progress || 0) + '%')"></div>
                </div>
                <span class="op-status" x-text="op.statusText || op.status"></span>
                <button class="btn btn-sm btn-link" x-show="op.status === 'running' && op.canCancel" @click="cancelOp(op)">Cancel</button>
                <button class="btn btn-sm btn-link" x-show="op.status === 'error' && op.canRetryAsAdmin" @click="retryAsAdmin(op)">Retry as admin</button>
                <button class="btn btn-sm btn-link" x-show="op.outputPaneId" @click="activateTab(op.outputPaneId)">View output</button>
            </div>
        </template>
    </div>
</div>

<!-- ============== MODALS ============== -->
<!-- Window host (shows the active preview/editor window) -->
<div id="ex-partials"></div>

<!-- Toasts -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000">
    <template x-for="t in toasts" :key="t.id">
        <div class="toast show" :class="'text-bg-' + (t.kind || 'secondary')" role="alert">
            <div class="d-flex">
                <div class="toast-body" x-text="t.message"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" @click="dismissToast(t.id)"></button>
            </div>
        </div>
    </template>
</div>

<!-- Hidden file input for uploads -->
<input type="file" id="uploadInput" multiple style="display:none" @change="onUploadFiles($event)">

<!-- ============== SCRIPTS ============== -->
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/prism.js" data-manual></script>
<!-- Load common prism languages -->
<script>
  // Async-load language components from prism-components on demand
  window.__prismLoaded = new Set(['markup', 'css', 'clike', 'javascript']);
  window.loadPrismLanguage = function(lang) {
    if (!lang || window.__prismLoaded.has(lang)) return Promise.resolve();
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = 'js/prism-components/prism-' + lang + '.min.js';
      s.onload = () => { window.__prismLoaded.add(lang); resolve(); };
      s.onerror = () => resolve();
      document.head.appendChild(s);
    });
  };
</script>
<script src="js/utils.js"></script>
<script src="js/fs.js"></script>
<script src="js/git.js"></script>
<script src="js/runtime.js"></script>
<script src="js/features/grub.js"></script>
<script src="js/features/mounts.js"></script>
<script src="js/features/github.js"></script>
<script src="js/features/actions.js"></script>
<script src="js/features/terminal.js"></script>
<script src="js/features/upload.js"></script>
<script src="js/features/editor.js"></script>
<script src="js/features/deeplink.js"></script>
<script src="js/features/plugins.js"></script>
<script src="js/core/tabs.js"></script>
<script src="js/core/filelist.js"></script>
<script src="js/core/fileops.js"></script>
<script src="js/core/output.js"></script>
<script src="js/core/dialogs.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/js-yaml.min.js"></script>
<!-- xterm.js for integrated split terminal (v1.1) -->
<script src="js/xterm.js"></script>
<script src="js/xterm-addon-fit.js"></script>
<!-- Monaco AMD loader + worker config (Monaco itself is lazy-loaded by app.js when editor opens) -->
<script>
  // Defer Monaco's globals; loader.js sets window.require / window.define.
  window.MonacoEnvironment = {
    getWorkerUrl: function (moduleId, label) { return 'js/monaco/worker-wrapper.js'; }
  };
</script>
<script src="js/monaco/vs/loader.js"></script>
<script>
  // Configure AMD baseUrl for Monaco
  if (window.require && window.require.config) {
    window.require.config({ paths: { vs: 'js/monaco/vs' } });
  }
</script>
<script src="js/app.js"></script>
<script src="js/boot.js"></script>

</body>
</html>
