<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <title>Explorer SVG preview sample</title>
  <desc>A synthetic SVG test pattern for exercising Explorer's SVG preview.</desc>
  <rect x="0" y="0" width="320" height="240" fill="#1e293b"/>
  <rect x="10" y="10" width="60" height="60" fill="#ef4444"/>
  <rect x="80" y="10" width="60" height="60" fill="#22c55e"/>
  <rect x="150" y="10" width="60" height="60" fill="#3b82f6"/>
  <rect x="220" y="10" width="60" height="60" fill="#eab308"/>
  <circle cx="160" cy="150" r="60" fill="none" stroke="#f8fafc" stroke-width="4"/>
  <text x="160" y="155" font-family="sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle">SVG SAMPLE</text>
  <text x="160" y="220" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">/home/ismet/sample/sample.svg</text>
</svg>
