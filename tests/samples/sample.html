<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explorer HTML preview sample</title>
  <style>
    body { font-family: sans-serif; background: #1e293b; color: #f8fafc; padding: 2rem; }
    h1 { color: #38bdf8; }
    code { background: #0f172a; padding: 0.15em 0.4em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Explorer HTML Preview Sample</h1>
  <p>This is a synthetic HTML file for exercising Explorer's rendered HTML
     preview path (a sandboxed iframe), the <code>Source</code>/<code>Rendered</code>
     toggle, and the opt-in <code>Enable scripts</code> control.</p>
  <ul>
    <li>Item one</li>
    <li>Item two</li>
    <li>Item three</li>
  </ul>
  <p id="js-status">Scripts are disabled (this text is set in the markup).</p>
  <script>
    // Runs only when the viewer opts in via "Enable scripts". Deliberately
    // trivial and error-free so it never trips the e2e console/pageerror
    // collectors — its only job is to make the scripts toggle observable.
    document.getElementById('js-status').textContent =
      'Scripts are enabled (this text was set by JavaScript).';
  </script>
</body>
</html>
